<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Speech-Native RAG Advisory — Demo</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 760px;
    margin: 2.5rem auto;
    padding: 0 1rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.3rem; margin-bottom: 0.2rem; }
  p.sub { color: #888; margin-top: 0; }
  textarea {
    width: 100%;
    box-sizing: border-box;
    font-size: 1rem;
    padding: 0.6rem;
    min-height: 4.5rem;
    resize: vertical;
  }
  #backend-url {
    width: 100%;
    box-sizing: border-box;
    font-size: 0.85rem;
    padding: 0.4rem;
    margin-bottom: 0.6rem;
    color: #888;
  }
  button {
    margin-top: 0.6rem;
    padding: 0.5rem 1.2rem;
    font-size: 1rem;
    cursor: pointer;
  }
  #status { margin-top: 0.6rem; color: #888; font-size: 0.9rem; }
  #result {
    margin-top: 1.2rem;
    border: 1px solid #8883;
    border-radius: 8px;
    padding: 1rem;
    display: none;
  }
  #result.escalate { border-color: #d97706; }
  #result.answered { border-color: #16a34a; }
  .badge {
    display: inline-block;
    font-size: 0.75rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: #8882;
    margin-left: 0.4rem;
  }
  .field { margin-top: 0.6rem; }
  .field .label { font-size: 0.8rem; color: #888; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 0.85rem; }
  .modes { margin-top: 0.3rem; }
  .mode-btn {
    margin: 0;
    margin-right: 0.4rem;
    padding: 0.35rem 0.8rem;
    font-size: 0.85rem;
    border: 1px solid #8886;
    background: transparent;
    border-radius: 999px;
    cursor: pointer;
  }
  .mode-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  #record.recording { background: #dc2626; color: #fff; border-color: #dc2626; }
  #playback { width: 100%; margin-top: 0.5rem; display: none; }
</style>
</head>
<body>

<h1>Speech-Native RAG Advisory — Demo</h1>
<p class="sub">Text or voice query → dialect mapping → hybrid retrieval → LLM generation → confidence gate</p>

<label class="field">
  <span class="label">Backend URL</span>
  <input id="backend-url" value="http://localhost:8000" />
</label>

<div class="field">
  <span class="label">Mode</span>
  <div class="modes">
    <button type="button" class="mode-btn active" id="mode-text" data-mode="text">Type</button>
    <button type="button" class="mode-btn" id="mode-voice" data-mode="voice">🎤 Record voice</button>
  </div>
</div>

<div id="text-panel">
  <textarea id="query" placeholder="e.g. Kapas ke phool aur tinde me gulabi sundi lag gayi hai">Kapas ke phool aur tinde me gulabi sundi lag gayi hai</textarea>
</div>

<div id="voice-panel" style="display:none;">
  <button type="button" id="record">● Record</button>
  <span id="rec-status" class="label"></span>
  <audio id="playback" controls></audio>
  <p class="sub" style="font-size:0.8rem;">Sent to <code>/query-audio</code> — transcribed with Whisper (ASR-cascade mode), then run through the same dialect-mapping → retrieval → gate path as text queries.</p>
</div>

<br />
<button id="submit">Ask</button>
<span id="status"></span>

<div id="result"></div>

<script>
const $ = (id) => document.getElementById(id);

async function checkHealth() {
  try {
    const res = await fetch($('backend-url').value + '/health');
    const data = await res.json();
    $('status').textContent = data.llm_loaded
      ? 'backend: ready (real LLM loaded)'
      : 'backend: ready (template fallback -- no LLM loaded)';
  } catch {
    $('status').textContent = 'backend: unreachable';
  }
}

function field(label, value) {
  return `<div class="field"><span class="label">${label}</span><div>${value}</div></div>`;
}

// ---- mode toggle -----------------------------------------------------
let mode = 'text';
let recordedBlob = null;

function setMode(next) {
  mode = next;
  $('mode-text').classList.toggle('active', mode === 'text');
  $('mode-voice').classList.toggle('active', mode === 'voice');
  $('text-panel').style.display = mode === 'text' ? '' : 'none';
  $('voice-panel').style.display = mode === 'voice' ? '' : 'none';
}
$('mode-text').addEventListener('click', () => setMode('text'));
$('mode-voice').addEventListener('click', () => setMode('voice'));

// ---- voice recording (MediaRecorder) ---------------------------------
let mediaRecorder = null;
let chunks = [];

$('record').addEventListener('click', async () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(chunks, { type: 'audio/webm' });
      const playback = $('playback');
      playback.src = URL.createObjectURL(recordedBlob);
      playback.style.display = 'block';
      stream.getTracks().forEach((t) => t.stop());
      $('record').textContent = '● Record';
      $('record').classList.remove('recording');
      $('rec-status').textContent = 'recorded — ready to send';
    };
    mediaRecorder.start();
    $('record').textContent = '■ Stop';
    $('record').classList.add('recording');
    $('rec-status').textContent = 'recording...';
  } catch (e) {
    $('rec-status').textContent = `mic access failed: ${e}`;
  }
});

// ---- submit ------------------------------------------------------------
$('submit').addEventListener('click', async () => {
  const resultEl = $('result');
  let res;

  if (mode === 'text') {
    const query = $('query').value.trim();
    if (!query) return;
    resultEl.style.display = 'block';
    resultEl.className = '';
    resultEl.innerHTML = 'Running pipeline...';
    $('submit').disabled = true;
    try {
      res = await fetch($('backend-url').value + '/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: query }),
      });
    } catch (e) {
      resultEl.innerHTML = `<strong>Request failed:</strong> ${e}`;
      $('submit').disabled = false;
      return;
    }
  } else {
    if (!recordedBlob) {
      $('rec-status').textContent = 'record something first';
      return;
    }
    resultEl.style.display = 'block';
    resultEl.className = '';
    resultEl.innerHTML = 'Transcribing (Whisper) and running pipeline...';
    $('submit').disabled = true;
    const form = new FormData();
    form.append('audio', recordedBlob, 'query.webm');
    try {
      res = await fetch($('backend-url').value + '/query-audio', {
        method: 'POST',
        body: form,
      });
    } catch (e) {
      resultEl.innerHTML = `<strong>Request failed:</strong> ${e}`;
      $('submit').disabled = false;
      return;
    }
  }

  try {
    const r = await res.json();

    if (r.error) {
      resultEl.innerHTML = `<strong>Error:</strong> ${r.error}`;
      return;
    }

    resultEl.className = r.escalate ? 'escalate' : 'answered';
    resultEl.innerHTML = `
      <div><strong>Answer</strong>
        <span class="badge">${r.answer_source}</span>
        <span class="badge">${r.escalate ? 'ESCALATED' : 'ANSWERED'}</span>
      </div>
      <pre>${r.answer}</pre>
      ${mode === 'voice' ? field('Transcript (Whisper ASR)', r.original_query ?? '—') : ''}
      ${field('Normalized query', r.normalized_query ?? '—')}
      ${field('Matched dialect terms', (r.matched_dialect_terms || []).join(', ') || '—')}
      ${field('Top-1 retrieved passage', `${r.top1_title ?? '—'} (score=${r.top1_score?.toFixed(4) ?? '—'})`)}
      ${field('Confidence', r.confidence?.toFixed(3) ?? '—')}
      ${field('Timings (sec)', `<pre>${JSON.stringify(r.timings_sec, null, 2)}</pre>`)}
    `;
  } catch (e) {
    resultEl.innerHTML = `<strong>Request failed:</strong> ${e}`;
  } finally {
    $('submit').disabled = false;
  }
});

checkHealth();
</script>

</body>
</html>
